name: Whonix Cloud Worker

on:
  workflow_call:
    inputs:
      build_mode:
        description: "Release, Nightly, or Cache"
        required: true
        type: string
      release_flavor:
        description: "Release flavor label"
        required: true
        type: string
      artifact_id:
        description: "Unique matrix artifact ID"
        required: true
        type: string
      flavors_list:
        description: "Flavor list passed to the build"
        required: true
        type: string
      dist_build_multi_target_list:
        description: "Output target"
        required: true
        type: string
      arch:
        description: "Target CPU architecture"
        required: true
        type: string
      type:
        description: "System footprint type"
        required: true
        type: string
      freshness:
        description: "APT sources freshness"
        required: true
        type: string
      container_engine:
        description: "Container engine"
        required: true
        type: string
      dist_build_redistributable:
        description: "Whether the output is redistributable"
        required: true
        type: boolean
      allow_untagged:
        description: "Allow untagged sources"
        required: true
        type: boolean
      allow_uncommitted:
        description: "Allow uncommitted source changes"
        required: true
        type: boolean
      remote_derivative_packages:
        description: "Use remote derivative packages"
        required: true
        type: boolean
      version:
        description: "Resolved build version"
        required: true
        type: string
      release_tag:
        description: "Resolved release tag"
        required: true
        type: string
      flavor_meta_packages_to_install:
        description: "Additional meta packages"
        required: false
        type: string
      install_package_list:
        description: "Additional packages"
        required: false
        type: string
      derivative_apt_repository_opts:
        description: "Custom APT repository options"
        required: false
        type: string
      debfullname:
        description: "Signing-key owner name"
        required: true
        type: string
      debemail:
        description: "Signing-key owner email"
        required: true
        type: string
      cleanup:
        description: "Wipe host pre-run"
        required: true
        type: boolean
      update_approx_cache:
        description: "Save and prune approx cache"
        required: true
        type: boolean

    secrets:
      CI_PRIVATE_KEY:
        required: true

jobs:
  dm-build-official:
    name: ${{ inputs.version }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: write

    env:
      BUILD_MODE: ${{ inputs.build_mode }}
      BUILD_ARCH: ${{ inputs.arch }}
      BUILD_TYPE: ${{ inputs.type }}
      BUILD_FRESHNESS: ${{ inputs.freshness }}
      ENGINE: ${{ inputs.container_engine }}
      DERIVATIVE_APT_REPOSITORY_OPTS: ${{ inputs.derivative_apt_repository_opts }}
      CHOSEN_VERSION: ${{ inputs.version }}
      RELEASE_TAG: ${{ inputs.release_tag }}
      RELEASE_FLAVOR: ${{ inputs.release_flavor }}
      ALLOW_UNTAGGED: ${{ inputs.allow_untagged }}
      ALLOW_UNCOMMITTED: ${{ inputs.allow_uncommitted }}
      ALLOW_REMOTE: ${{ inputs.remote_derivative_packages }}
      DEBFULLNAME: ${{ inputs.debfullname }}
      DEBEMAIL: ${{ inputs.debemail }}
      BUILD_ARTIFACT_ID: ${{ inputs.artifact_id }}
      CLEANUP: ${{ inputs.cleanup }}
      flavors_list: ${{ inputs.flavors_list }}
      dist_build_target_arch: ${{ inputs.arch }}
      dist_build_multi_target_list: ${{ inputs.dist_build_multi_target_list }}
      dist_build_version_type: ${{ inputs.type }}
      dist_build_freshness: ${{ inputs.freshness }}
      dist_build_redistributable: ${{ inputs.dist_build_redistributable }}
      flavor_meta_packages_to_install: ${{ inputs.flavor_meta_packages_to_install }}
      install_package_list: ${{ inputs.install_package_list }}

    steps:
      - name: Checkout Build Source
        uses: actions/checkout@v5
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          fetch-tags: true
          submodules: false

      - name: Set Up & Clean Host
        shell: bash
        run: ./.github/scripts/setup-host.sh

      - name: Prepare Cache Metadata
        id: cache-meta
        shell: bash
        env:
          FRESHNESS: ${{ inputs.freshness }}
          SNAP_HASH: ${{ hashFiles('build_sources/frozen-snapshot-timestamp') }}
          ARCH: ${{ inputs.arch }}
          RUN_ID: ${{ github.run_id }}
          ARTIFACT_ID: ${{ inputs.artifact_id }}
        run: |
          if [ "${FRESHNESS}" = "frozen" ]; then
            tier="frozen-${SNAP_HASH}"
          else
            tier="current-$(date -u +%G-W%V)"
          fi
          prefix="approx-trixie-${tier}-${ARCH}-"
          {
            echo "tier=${tier}"
            echo "approx_prefix=${prefix}"
            echo "approx_key=${prefix}${RUN_ID}-${ARTIFACT_ID}"
          } | tee -a -- "${GITHUB_OUTPUT}"

      - name: Prepare Debian Trixie Base Image
        uses: ./.github/actions/prepare-debian-base

      - name: Cache Derivative Maker OCI Image
        uses: actions/cache@v5
        with:
          path: oci-image.tar.zst
          key: >-
            ${{ format(
              'oci-trixie-{0}-{1}-{2}',
              steps.cache-meta.outputs.tier,
              inputs.arch,
              hashFiles('oci/*', 'build_sources/debian_stable_frozen_direct_clearnet.sources.in')
            ) }}

      - name: Restore Approx Package Repository
        uses: actions/cache/restore@v5
        with:
          path: approx-cache.tar.zst
          key: ${{ steps.cache-meta.outputs.approx_key }}
          restore-keys: |
            ${{ steps.cache-meta.outputs.approx_prefix }}

      - name: Snapshot Restored Approx Size
        id: approx-before
        shell: bash
        run: echo "size_approx=$(stat -c '%s' approx-cache.tar.zst 2>/dev/null || echo 0)" | tee -a -- "${GITHUB_OUTPUT}"

      - name: Execute Build Pipeline
        shell: bash
        env:
          CI_PRIVATE_KEY: ${{ secrets.CI_PRIVATE_KEY }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          KEY_DIR: "/home/debian/.key_mnt"
          KEY_FILE: "/home/debian/.key_mnt/my-private-key.asc"
          GIT_URL: "${{ github.server_url }}/${{ github.repository }}"
          GIT_BRANCH: ${{ github.ref_name }}
          INTERACTIVE: "false"
        run: ./.github/scripts/vm-setup.sh

      - name: Extract VM Caches
        shell: bash
        env:
          UPDATE_APPROX_CACHE: ${{ inputs.update_approx_cache }}
        run: |
          ./.github/scripts/vm-sync-helper.sh save-cache "${GITHUB_WORKSPACE}/approx-cache.tar.zst"
          ./.github/scripts/vm-sync-helper.sh save-oci-image "${GITHUB_WORKSPACE}/oci-image.tar.zst"

      - name: Gather & Stage Artifacts
        if: inputs.build_mode != 'cache'
        shell: bash
        env:
          GIT_URL: "${{ github.server_url }}/${{ github.repository }}"
        run: ./.github/scripts/gather-artifacts.sh

      - name: Shutdown VM
        if: ${{ !cancelled() }}
        shell: bash
        run: ./.github/scripts/vm-sync-helper.sh shutdown-vm "${GITHUB_WORKSPACE}/qemu.pid"

      - name: Update Approx Package Repository Cache
        if: success() && inputs.update_approx_cache
        uses: ./.github/actions/update-approx-cache
        with:
          before_size: ${{ steps.approx-before.outputs.size_approx }}
          cache_key: ${{ steps.cache-meta.outputs.approx_key }}
          cache_prefix: ${{ steps.cache-meta.outputs.approx_prefix }}
          github_token: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload Staged Build Outputs
        if: inputs.build_mode != 'cache'
        uses: actions/upload-artifact@v7
        with:
          name: whonix-cloud-${{ github.run_id }}-${{ inputs.artifact_id }}
          path: release-staging/
          if-no-files-found: error
          retention-days: 1


