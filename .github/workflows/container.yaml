name: Derivative Maker CI

on:
  workflow_call:
    inputs:
      build_mode:
        description: "Release or Nightly"
        required: true
        type: string
      release_flavor:
        description: "Release flavor label"
        required: true
        type: string
      artifact_id:
        description: "Unique matrix artifact ID"
        required: true
        type: string
      flavors_list:
        description: "Flavor list passed to the build"
        required: true
        type: string
      dist_build_multi_target_list:
        description: "Output target"
        required: true
        type: string
      arch:
        description: "Target CPU architecture"
        required: true
        type: string
      type:
        description: "System footprint type"
        required: true
        type: string
      freshness:
        description: "APT sources freshness"
        required: true
        type: string
      container_engine:
        description: "Container engine"
        required: true
        type: string
      dist_build_redistributable:
        description: "Whether the output is redistributable"
        required: true
        type: boolean
      allow_untagged:
        description: "Allow untagged sources"
        required: true
        type: boolean
      allow_uncommitted:
        description: "Allow uncommitted source changes"
        required: true
        type: boolean
      allow_unfrozen:
        description: "Allow unfrozen sources"
        required: true
        type: boolean
      remote_derivative_packages:
        description: "Use remote derivative packages"
        required: true
        type: boolean
      version:
        description: "Resolved build version"
        required: true
        type: string
      release_tag:
        description: "Resolved release tag"
        required: true
        type: string
      flavor_meta_packages_to_install:
        description: "Additional meta packages"
        required: false
        type: string
      install_package_list:
        description: "Additional packages"
        required: false
        type: string
      derivative_apt_repository_opts:
        description: "Custom APT repository options"
        required: false
        type: string
      debfullname:
        description: "Signing-key owner name"
        required: true
        type: string
      debemail:
        description: "Signing-key owner email"
        required: true
        type: string
      cleanup:
        description: "Wipe host pre-run"
        required: true
        type: boolean
      update_approx_cache:
        description: "Save and prune approx cache"
        required: true
        type: boolean

    secrets:
      CI_PRIVATE_KEY:
        required: true

jobs:
  dm-build-official:
    name: ${{ inputs.version }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: write

    env:
      BUILD_MODE: ${{ inputs.build_mode }}
      BUILD_ARCH: ${{ inputs.arch }}
      BUILD_TYPE: ${{ inputs.type }}
      BUILD_FRESHNESS: ${{ inputs.freshness }}
      ENGINE: ${{ inputs.container_engine }}
      DERIVATIVE_APT_REPOSITORY_OPTS: ${{ inputs.derivative_apt_repository_opts }}
      CHOSEN_VERSION: ${{ inputs.version }}
      RELEASE_TAG: ${{ inputs.release_tag }}
      RELEASE_FLAVOR: ${{ inputs.release_flavor }}
      ALLOW_UNTAGGED: ${{ inputs.allow_untagged }}
      ALLOW_UNCOMMITTED: ${{ inputs.allow_uncommitted }}
      ALLOW_UNFROZEN: ${{ inputs.allow_unfrozen }}
      ALLOW_REMOTE: ${{ inputs.remote_derivative_packages }}
      DEBFULLNAME: ${{ inputs.debfullname }}
      DEBEMAIL: ${{ inputs.debemail }}
      BUILD_ARTIFACT_ID: ${{ inputs.artifact_id }}
      CLEANUP: ${{ inputs.cleanup }}
      flavors_list: ${{ inputs.flavors_list }}
      dist_build_target_arch: ${{ inputs.arch }}
      dist_build_multi_target_list: ${{ inputs.dist_build_multi_target_list }}
      dist_build_version_type: ${{ inputs.type }}
      dist_build_freshness: ${{ inputs.freshness }}
      dist_build_redistributable: ${{ inputs.dist_build_redistributable }}
      flavor_meta_packages_to_install: ${{ inputs.flavor_meta_packages_to_install }}
      install_package_list: ${{ inputs.install_package_list }}

    steps:
      - name: Checkout Build Source
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          fetch-tags: true
          submodules: false

      - name: Set Up & Clean Host
        shell: bash
        run: ./.github/scripts/setup-host.sh

      - name: Resolve Debian Cloud Image State
        id: cloud-images
        shell: bash
        run: |
          ref="$(bash ./.github/scripts/build-debian-vm-base.sh --resolve)"
          echo "Resolved Debian Cloud Team revision: ${ref}"
          echo "ref=${ref}" >> "${GITHUB_OUTPUT}"

      - name: Get Current ISO Week
        id: iso-week
        shell: bash
        run: echo "week=$(date -u +%G-W%V)" | tee -a -- "${GITHUB_OUTPUT}"

      - name: Compute Weekly Approx Cache Key
        id: approx-key
        shell: bash
        run: |
          prefix="approx-trixie-${{ steps.iso-week.outputs.week }}-${{ inputs.arch }}-"
          echo "prefix=${prefix}" | tee -a -- "${GITHUB_OUTPUT}"
          echo "key=${prefix}${{ github.run_id }}-${{ inputs.artifact_id }}" | tee -a -- "${GITHUB_OUTPUT}"

      - name: Restore Debian Trixie Base Image
        id: restore-base-image
        uses: actions/cache/restore@v5
        with:
          path: |
            debian-base.qcow2
            debian-base.qcow2.buildinfo
          key: >-
            ${{ format(
              'debian-trixie-base-{0}-{1}',
              steps.cloud-images.outputs.ref,
              hashFiles(
                '.github/scripts/build-debian-vm-base.sh',
                '.github/scripts/setup-host.sh',
                '.github/scripts/verify-debian-vm-base.sh'
              )
            ) }}

      - name: Cache Frozen OCI Image
        if: ${{ !inputs.allow_unfrozen }}
        uses: actions/cache@v5
        with:
          path: oci-image.tar.zst
          key: >-
            ${{ format(
              'oci-trixie-frozen-{0}-{1}',
              inputs.arch,
              hashFiles(
                'oci/*',
                'build_sources/frozen-snapshot-timestamp',
                'build_sources/debian_stable_frozen_direct_clearnet.sources.in'
              )
            ) }}

      - name: Cache Unfrozen OCI Image
        if: inputs.allow_unfrozen
        uses: actions/cache@v5
        with:
          path: oci-image.tar.zst
          key: >-
            ${{ format(
              'oci-trixie-unfrozen-{0}-{1}-{2}',
              inputs.arch,
              steps.iso-week.outputs.week,
              hashFiles('oci/*')
            ) }}

      - name: Restore Approx Package Repository
        uses: actions/cache/restore@v5
        with:
          path: approx-cache.tar.zst
          key: ${{ steps.approx-key.outputs.key }}
          restore-keys: |
            ${{ steps.approx-key.outputs.prefix }}

      - name: Snapshot Restored Approx Size
        id: approx-before
        shell: bash
        run: echo "size_approx=$(stat -c '%s' approx-cache.tar.zst 2>/dev/null || echo 0)" | tee -a -- "${GITHUB_OUTPUT}"

      - name: Build Debian Trixie Base Image
        if: steps.restore-base-image.outputs.cache-hit != 'true'
        shell: bash
        env:
          CLOUD_IMAGES_REF: ${{ steps.cloud-images.outputs.ref }}
        run: bash ./.github/scripts/build-debian-vm-base.sh debian-base.qcow2 75G

      - name: Verify Debian Trixie Base Image
        shell: bash
        run: >-
          bash ./.github/scripts/verify-debian-vm-base.sh
          --ref "${{ steps.cloud-images.outputs.ref }}"
          --size 75G
          debian-base.qcow2

      - name: Save Debian Trixie Base Image
        if: steps.restore-base-image.outputs.cache-hit != 'true'
        uses: actions/cache/save@v5
        with:
          path: |
            debian-base.qcow2
            debian-base.qcow2.buildinfo
          key: ${{ steps.restore-base-image.outputs.cache-primary-key }}

      - name: Execute Build Pipeline
        shell: bash
        env:
          CI_PRIVATE_KEY: ${{ secrets.CI_PRIVATE_KEY }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          KEY_DIR: "/home/debian/.key_mnt"
          KEY_FILE: "/home/debian/.key_mnt/my-private-key.asc"
          GIT_URL: "${{ github.server_url }}/${{ github.repository }}"
          GIT_BRANCH: ${{ github.ref_name }}
        run: ./.github/scripts/vm-setup.sh

      - name: Gather & Stage Artifacts
        shell: bash
        env:
          GIT_URL: "${{ github.server_url }}/${{ github.repository }}"
        run: ./.github/scripts/gather-artifacts.sh

      - name: Evaluate Approx Cache Growth
        id: approx-after
        if: success() && inputs.update_approx_cache
        shell: bash
        run: |
          before="${{ steps.approx-before.outputs.size_approx }}"
          after="$(stat -c '%s' approx-cache.tar.zst 2>/dev/null || echo 0)"
          growth=$(( after - before ))
          echo "should_save=$(( after > 0 && growth >= 20971520 ? 1 : 0 ))" | tee -a -- "${GITHUB_OUTPUT}"

      - name: Save Updated Approx Package Repository
        id: save-approx
        if: steps.approx-after.outputs.should_save == '1'
        uses: actions/cache/save@v5
        with:
          path: approx-cache.tar.zst
          key: ${{ steps.approx-key.outputs.key }}

      - name: Prune Superseded Approx Caches
        if: steps.save-approx.outcome == 'success'
        continue-on-error: true
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          APPROX_PREFIX: ${{ steps.approx-key.outputs.prefix }}
        run: |
          gh cache list --repo "${{ github.repository }}" --limit 100 --json id,key,createdAt \
            --jq '[.[] | select(.key | startswith(env.APPROX_PREFIX))] | sort_by(.createdAt) | .[:-1] | .[].id' | \
            xargs -r -n 1 gh cache delete --repo "${{ github.repository }}"

      - name: Upload Staged Build Outputs
        uses: actions/upload-artifact@v4
        with:
          name: derivative-${{ github.run_id }}-${{ inputs.artifact_id }}
          path: release-staging/
          if-no-files-found: error
          retention-days: 1

