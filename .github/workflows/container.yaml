name: Derivative Maker CI

on:
  workflow_dispatch:
    inputs:
      flavors_list:
        description: "Flavor List"
        required: false
        default: "kicksecure-lxqt whonix-gateway-lxqt whonix-workstation-lxqt"
        type: string

      dist_build_multi_target_list:
        description: "Target List"
        required: false
        default: "qcow2"
        type: string

      arch:
        description: "Target CPU Architecture"
        required: false
        default: "amd64"
        type: choice
        options:
          - "amd64"
          - "arm64"

      type:
        description: "System Footprint Type"
        required: false
        default: "vm"
        type: choice
        options:
          - "vm"
          - "container"
          - "base"
          - "host"

      freshness:
        description: "APT Sources Freshness"
        required: false
        default: "frozen"
        type: choice
        options:
          - "frozen"
          - "current"

      container_engine:
        description: "Container Engine"
        required: false
        default: "podman"
        type: choice
        options:
          - "podman"
          - "docker"
          - "nerdctl"
          - "colima"
          - "buildah"

      dist_build_redistributable:
        description: "Production Release"
        required: false
        default: true
        type: boolean

      allow_untagged:
        description: "Allow Untagged"
        required: false
        default: false
        type: boolean

      allow_uncommitted:
        description: "Allow Uncommitted"
        required: false
        default: false
        type: boolean

      allow_unfrozen:
        description: "Allow Unfrozen Sources"
        required: false
        default: false
        type: boolean

      remote_derivative_packages:
        description: "Remote Packages"
        required: false
        default: false
        type: boolean

      version:
        description: "Release Version"
        required: false
        default: "18.2.4.8"
        type: string

      flavor_meta_packages_to_install:
        description: "Extra Meta Packages"
        required: false
        default: ""
        type: string

      install_package_list:
        description: "Extra Package List"
        required: false
        default: ""
        type: string

      derivative_apt_repository_opts:
        description: "Custom APT Repo"
        required: false
        default: ""
        type: string

      debfullname:
        description: "Key Owner Identity"
        required: false
        default: "tabletseeker-ci"
        type: string

      debemail:
        description: "Key Owner E-mail"
        required: false
        default: "tabletseeker-ci@github.com"
        type: string

      release_flavor:
        description: "Flavor Release Label"
        required: false
        default: ""
        type: string

jobs:
  dm-build-official:
    name: DM Release Pipeline
    runs-on: ubuntu-latest
    environment: release-signing
    permissions:
      contents: write

    env:
      BUILD_ARCH: ${{ github.event.inputs.arch }}
      BUILD_TYPE: ${{ github.event.inputs.type }}
      BUILD_FRESHNESS: ${{ github.event.inputs.freshness }}
      ENGINE: ${{ github.event.inputs.container_engine }}
      DERIVATIVE_APT_REPOSITORY_OPTS: ${{ github.event.inputs.derivative_apt_repository_opts }}
      CHOSEN_VERSION: ${{ github.event.inputs.version }}
      ALLOW_UNTAGGED: ${{ github.event.inputs.allow_untagged }}
      ALLOW_UNCOMMITTED: ${{ github.event.inputs.allow_uncommitted }}
      ALLOW_UNFROZEN: ${{ github.event.inputs.allow_unfrozen }}
      ALLOW_REMOTE: ${{ github.event.inputs.remote_derivative_packages }}
      DEBFULLNAME: ${{ github.event.inputs.debfullname }}
      DEBEMAIL: ${{ github.event.inputs.debemail }}
      flavors_list: ${{ github.event.inputs.flavors_list }}
      dist_build_target_arch: ${{ github.event.inputs.arch }}
      dist_build_multi_target_list: ${{ github.event.inputs.dist_build_multi_target_list }}
      dist_build_version_type: ${{ github.event.inputs.type }}
      dist_build_freshness: ${{ github.event.inputs.freshness }}
      dist_build_redistributable: ${{ github.event.inputs.dist_build_redistributable }}
      flavor_meta_packages: ${{ inputs.flavor_meta_packages_to_install }}
      install_package_list: ${{ inputs.install_package_list }}

    steps:
      - name: Checkout Repository Core and History
        uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref || github.ref_name }}
          fetch-depth: 0
          fetch-tags: true
          submodules: false

      - name: Initialize and Clean Host Environment
        shell: bash
        run: |
          ./.github/scripts/setup-host.sh

      - name: Compile and Execute Guest OS Build
        shell: bash
        env:
          CI_PRIVATE_KEY: ${{ secrets.CI_PRIVATE_KEY }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          KEY_DIR: "/home/debian/.key_mnt"
          KEY_FILE: "/home/debian/.key_mnt/my-private-key.asc"
          GIT_URL: "https://github.com/tabletseeker/derivative-maker"
          GIT_BRANCH: ${{ github.ref_name }}
        run: |
          ./.github/scripts/build-guest.sh

      - name: Gather, Process, and Publish Release Artifacts
        shell: bash
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_FLAVOR: ${{ inputs.release_flavor }}
          GIT_URL: "https://github.com/tabletseeker/derivative-maker"
        run: |
          ./.github/scripts/gather-artifacts.sh
