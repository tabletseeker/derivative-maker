name: Whonix Cloud Matrix

on:
  workflow_dispatch:
    inputs:
      build_mode:
        description: "Build mode"
        required: false
        default: "release"
        type: choice
        options:
          - "release"
          - "nightly"
          - "cache"

      matrix_assets:
        description: "Matrix asset selection"
        required: false
        default: "cli-vm-amd64 kicksecure-lxqt-amd64-vm whonix-lxqt-amd64-vm"
        type: string

      version_prefix:
        description: "Version family"
        required: false
        default: ""
        type: string

      version_override:
        description: "Custom Version"
        required: false
        default: ""
        type: string

      release_name:
        description: "Production release prefix"
        required: false
        default: "Production Release:"
        type: string

      freshness:
        description: "APT sources freshness"
        required: false
        default: "frozen"
        type: choice
        options:
          - "frozen"
          - "current"

      allow_untagged:
        description: "Allow untagged sources"
        required: false
        default: false
        type: boolean

      allow_uncommitted:
        description: "Allow uncommitted changes"
        required: false
        default: false
        type: boolean

      allow_unfrozen:
        description: "Allow unfrozen sources"
        required: false
        default: false
        type: boolean

      remote_derivative_packages:
        description: "Use remote derivative packages"
        required: false
        default: false
        type: boolean

      dist_build_redistributable:
        description: "Production release"
        required: false
        default: true
        type: boolean

      cleanup:
        description: "Wipe host pre-run"
        required: false
        default: false
        type: boolean

      debfullname:
        description: "Signing-key owner name"
        required: false
        default: "tabletseeker-ci"
        type: string

      debemail:
        description: "Signing-key owner email"
        required: false
        default: "tabletseeker-ci@github.com"
        type: string

  schedule:
    - cron: "0 6 * * *"
    - cron: "5 0 * * 1"

permissions:
  contents: read
  actions: write

concurrency:
  group: >-
    whonix-cloud-${{
      inputs.version_prefix || vars.DEFAULT_VERSION_PREFIX
    }}-${{
      (github.event_name == 'schedule' && github.event.schedule == '5 0 * * 1') && 'cache' ||
      (github.event_name == 'schedule' && github.event.schedule == '0 6 * * *') && 'nightly' ||
      (inputs.build_mode || 'release')
    }}
  cancel-in-progress: false

jobs:
  resolve-config:
    name: Resolve workflow config
    runs-on: ubuntu-latest
    outputs:
      build_mode: ${{ steps.config.outputs.build_mode }}
      matrix_assets: ${{ steps.config.outputs.matrix_assets }}
      version_prefix: ${{ steps.config.outputs.version_prefix }}
      version_override: ${{ steps.config.outputs.version_override }}
      release_name: ${{ steps.config.outputs.release_name }}
      freshness: ${{ steps.config.outputs.freshness }}
      dist_build_redistributable: ${{ steps.config.outputs.dist_build_redistributable }}
      allow_untagged: ${{ steps.config.outputs.allow_untagged }}
      allow_uncommitted: ${{ steps.config.outputs.allow_uncommitted }}
      allow_unfrozen: ${{ steps.config.outputs.allow_unfrozen }}
      remote_derivative_packages: ${{ steps.config.outputs.remote_derivative_packages }}
      debfullname: ${{ steps.config.outputs.debfullname }}
      debemail: ${{ steps.config.outputs.debemail }}
      cleanup: ${{ steps.config.outputs.cleanup }}
    steps:
      - name: Checkout config script
        uses: actions/checkout@v5
        with:
          ref: ${{ github.sha }}
          sparse-checkout: |
            .github/scripts/resolve-config.sh

      - name: Resolve inputs & cron presets
        id: config
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          EVENT_SCHEDULE: ${{ github.event.schedule }}
          DEFAULT_VERSION_PREFIX: ${{ vars.DEFAULT_VERSION_PREFIX }}
          INPUT_BUILD_MODE: ${{ inputs.build_mode }}
          INPUT_MATRIX_ASSETS: ${{ inputs.matrix_assets }}
          INPUT_VERSION_PREFIX: ${{ inputs.version_prefix }}
          INPUT_VERSION_OVERRIDE: ${{ inputs.version_override }}
          INPUT_RELEASE_NAME: ${{ inputs.release_name }}
          INPUT_FRESHNESS: ${{ inputs.freshness }}
          INPUT_DIST_BUILD_REDISTRIBUTABLE: ${{ inputs.dist_build_redistributable }}
          INPUT_ALLOW_UNTAGGED: ${{ inputs.allow_untagged }}
          INPUT_ALLOW_UNCOMMITTED: ${{ inputs.allow_uncommitted }}
          INPUT_ALLOW_UNFROZEN: ${{ inputs.allow_unfrozen }}
          INPUT_REMOTE_DERIVATIVE_PACKAGES: ${{ inputs.remote_derivative_packages }}
          INPUT_DEBFULLNAME: ${{ inputs.debfullname }}
          INPUT_DEBEMAIL: ${{ inputs.debemail }}
          INPUT_CLEANUP: ${{ inputs.cleanup }}
        run: bash ./.github/scripts/resolve-config.sh

  select-matrix-assets:
    name: Select build assets
    needs: resolve-config
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.generate.outputs.matrix }}
      job_count: ${{ steps.generate.outputs.job_count }}
    steps:
      - name: Checkout matrix configuration
        uses: actions/checkout@v5
        with:
          ref: ${{ github.sha }}
          sparse-checkout: |
            .github/scripts/generate-matrix.sh
            .github/scripts/matrix-assets

      - name: Generate matrix
        id: generate
        shell: bash
        env:
          MATRIX_ASSETS: ${{ needs.resolve-config.outputs.matrix_assets }}
        run: bash ./.github/scripts/generate-matrix.sh

  resolve-version:
    name: Resolve build version
    needs: resolve-config
    runs-on: ubuntu-latest
    outputs:
      mode: ${{ steps.resolve.outputs.mode }}
      version: ${{ steps.resolve.outputs.version }}
      tag: ${{ steps.resolve.outputs.tag }}
    steps:
      - name: Checkout tags
        uses: actions/checkout@v5
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          fetch-tags: true

      - name: Resolve version and tag
        id: resolve
        shell: bash
        env:
          BUILD_MODE: ${{ needs.resolve-config.outputs.build_mode }}
          VERSION_PREFIX: ${{ needs.resolve-config.outputs.version_prefix }}
          VERSION_OVERRIDE: ${{ needs.resolve-config.outputs.version_override }}
        run: ./.github/scripts/resolve-version.sh

  dm-matrix:
    name: ${{ matrix.release_flavor }}
    needs:
      - resolve-config
      - select-matrix-assets
      - resolve-version
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.select-matrix-assets.outputs.matrix) }}
    uses: ./.github/workflows/container.yaml
    with:
      build_mode: ${{ needs.resolve-config.outputs.build_mode }}
      freshness: ${{ needs.resolve-config.outputs.freshness }}
      dist_build_redistributable: ${{ needs.resolve-config.outputs.dist_build_redistributable == 'true' }}
      allow_untagged: ${{ needs.resolve-config.outputs.allow_untagged == 'true' }}
      allow_uncommitted: ${{ needs.resolve-config.outputs.allow_uncommitted == 'true' }}
      allow_unfrozen: ${{ needs.resolve-config.outputs.allow_unfrozen == 'true' }}
      remote_derivative_packages: ${{ needs.resolve-config.outputs.remote_derivative_packages == 'true' }}
      version: ${{ needs.resolve-version.outputs.version }}
      release_tag: ${{ needs.resolve-version.outputs.tag }}
      release_flavor: ${{ matrix.release_flavor }}
      artifact_id: ${{ matrix.id }}
      flavors_list: ${{ matrix.flavors_list }}
      dist_build_multi_target_list: ${{ matrix.target }}
      arch: ${{ matrix.arch }}
      type: ${{ matrix.type }}
      container_engine: ${{ matrix.container_engine }}
      flavor_meta_packages_to_install: ${{ matrix.flavor_meta_packages_to_install }}
      install_package_list: ${{ matrix.install_package_list }}
      derivative_apt_repository_opts: ${{ matrix.derivative_apt_repository_opts }}
      debfullname: ${{ needs.resolve-config.outputs.debfullname }}
      debemail: ${{ needs.resolve-config.outputs.debemail }}
      cleanup: ${{ needs.resolve-config.outputs.cleanup == 'true' }}
      update_approx_cache: >-
        ${{
          needs.select-matrix-assets.outputs.job_count == '1' ||
          (needs.resolve-config.outputs.build_mode == 'cache' && startsWith(matrix.id, 'cache-'))
        }}
    secrets: inherit

  publish:
    name: Publish Merged Matrix Release
    if: needs.resolve-config.outputs.build_mode != 'cache'
    needs:
      - resolve-config
      - resolve-version
      - dm-matrix
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: read
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      CI_PRIVATE_KEY: ${{ secrets.CI_PRIVATE_KEY }}
      GIT_URL: "${{ github.server_url }}/${{ github.repository }}"
      BUILD_MODE: ${{ needs.resolve-version.outputs.mode }}
      BUILD_VERSION: ${{ needs.resolve-version.outputs.version }}
      RELEASE_TAG: ${{ needs.resolve-version.outputs.tag }}
      RELEASE_TITLE: ${{ needs.resolve-config.outputs.release_name }}
      DEBFULLNAME: ${{ needs.resolve-config.outputs.debfullname }}
      DEBEMAIL: ${{ needs.resolve-config.outputs.debemail }}
    steps:
      - name: Checkout Publisher Scripts
        uses: actions/checkout@v5
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          fetch-tags: true

      - name: Download Matrix Outputs
        uses: actions/download-artifact@v8
        with:
          pattern: whonix-cloud-${{ github.run_id }}-*
          path: release-artifacts

      - name: Publish Release
        shell: bash
        run: ./.github/scripts/publish-release.sh

